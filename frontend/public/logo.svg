<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Keepsy">
  <!-- Caja abierta con una foto saliendo: lo que guardás en Keepsy. Trazo blanco sobre degradé oscuro → rojo de marca. -->
  <defs>
    <linearGradient id="k-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#1c1d21" />
      <stop offset="1" stop-color="#d12c23" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#k-fondo)" />
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- solapas de atrás, abiertas -->
    <path d="M11 22 7.5 14.5 18 10.5 24 16.5" />
    <path d="M37 22 40.5 14.5 30 10.5 24 16.5" />
    <!-- foto (rellena para tapar lo de atrás) -->
    <g transform="rotate(-9 24 17)" fill="#1f1f24">
      <rect x="17" y="9" width="14" height="13" rx="1.6" />
      <path d="M18.6 20.5 22.4 15.2 24.6 18 26.2 16.4 29.4 20.5" fill="none" stroke-width="1.6" />
      <circle cx="27.6" cy="12.8" r="1.4" fill="#fff" stroke="none" />
    </g>
    <!-- cuerpo de la caja -->
    <path d="M11 22 24 28 37 22" fill="#1f1f24" />
    <path d="M11 22v13l13 6 13-6V22" />
    <path d="M24 28v13" />
    <!-- solapas de adelante, caídas hacia afuera -->
    <path d="M11 22 5.5 28.5 18 34 24 28" />
    <path d="M37 22 42.5 28.5 30 34 24 28" />
  </g>
</svg>
